name: Keep scheduled workflows active

on:
  schedule:
    # Public repositories disable scheduled workflows after 60 days without activity.
    - cron: '17 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record repository activity
        shell: bash
        run: |
          date --utc +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -m 'chore: keep scheduled workflows active'
          git push
